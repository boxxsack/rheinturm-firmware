name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Cache PlatformIO downloads
        uses: actions/cache@v4
        with:
          path: ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini', 'partitions_ota.csv', 'requirements-ci.txt', 'scripts/mbedtls_flags.sh', '.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libmbedtls-dev
          python -m pip install --upgrade -r requirements-ci.txt

      - name: Run native tests
        run: pio test -e native

      - name: Build firmware
        shell: bash
        run: |
          set -o pipefail
          pio run -e esp32dev | tee firmware-build.log

      - name: Add firmware size to summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Firmware size"
            echo '```text'
            grep -E '^(RAM|Flash):' firmware-build.log || echo "Firmware size unavailable because the build did not complete."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check OTA flash budget
        run: python3 scripts/check_flash_budget.py
