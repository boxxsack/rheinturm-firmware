name: Release

# Builds the firmware, signs firmware.bin (issue #17: OTA image-integrity
# verification), and publishes a GitHub Release with both firmware.bin and
# firmware.bin.sig as assets. The device fetches the signature from
# "<firmware-url>.sig" — see src/OtaImageVerifier.cpp and
# include/OtaSigningKey.h.
#
# The signing private key is read from the OTA_SIGNING_PRIVATE_KEY secret and
# only ever exists on disk inside this ephemeral runner, for the duration of
# the signing step.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-sign-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO and signing dependencies
        run: |
          pip install --upgrade platformio cryptography

      - name: Build firmware
        run: pio run -e esp32dev

      - name: Sign firmware.bin
        env:
          OTA_SIGNING_PRIVATE_KEY: ${{ secrets.OTA_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key_file="$(mktemp)"
          trap 'shred -u "$key_file" 2>/dev/null || rm -f "$key_file"' EXIT
          printf '%s' "$OTA_SIGNING_PRIVATE_KEY" > "$key_file"
          python3 scripts/sign_firmware.py "$key_file" \
            .pio/build/esp32dev/firmware.bin \
            .pio/build/esp32dev/firmware.bin.sig

      - name: Verify signature (fail closed before publishing)
        run: |
          python3 - <<'EOF'
          import sys
          from cryptography.exceptions import InvalidSignature
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding

          with open("include/OtaSigningKey.h") as f:
              header = f.read()
          pem_start = header.index("-----BEGIN PUBLIC KEY-----")
          pem_end = header.index("-----END PUBLIC KEY-----") + len("-----END PUBLIC KEY-----")
          public_key = serialization.load_pem_public_key(header[pem_start:pem_end].encode())

          with open(".pio/build/esp32dev/firmware.bin", "rb") as f:
              firmware = f.read()
          with open(".pio/build/esp32dev/firmware.bin.sig", "rb") as f:
              signature = f.read()

          try:
              public_key.verify(signature, firmware, padding.PKCS1v15(), hashes.SHA256())
          except InvalidSignature:
              print("FATAL: freshly produced signature does not verify against the embedded public key", file=sys.stderr)
              sys.exit(1)
          print("Signature verified against include/OtaSigningKey.h public key.")
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .pio/build/esp32dev/firmware.bin
            .pio/build/esp32dev/firmware.bin.sig
          generate_release_notes: true
