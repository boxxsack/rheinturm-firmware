; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_ota.csv
lib_deps = adafruit/Adafruit NeoPixel@^1.12.3

; Host-side unit test for OtaImageVerifier (issue #17), run with:
;   pio test -e native
; Requires a host mbedtls: `brew install mbedtls` (macOS) or
; `apt install libmbedtls-dev` (Linux). Not part of the ESP32 firmware build.
[env:native]
platform = native
test_build_src = true
build_src_filter = +<*> -<ESP32_BLE_WIFI_SCAN_FEAT.cpp> -<BLEConfigInterface.cpp> -<ConnectivityManager.cpp> -<TimeDisplay.cpp> -<NeoPixelAdapter.cpp>
build_flags =
    -std=gnu++17
    !./scripts/mbedtls_flags.sh
