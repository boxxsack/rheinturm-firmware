; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_ota.csv
lib_deps = adafruit/Adafruit NeoPixel@^1.12.3

; Host-side unit tests for pure logic modules, run with:
;   pio test -e native
; Requires a host mbedtls: `brew install mbedtls` (macOS) or
; `apt install libmbedtls-dev` (Linux). Not part of the ESP32 firmware build.
[env:native]
platform = native
test_build_src = true
build_src_filter = -<*>
build_flags = -std=gnu++17
extra_scripts = pre:scripts/native_test_config.py
